<text x="628" y="186" font-size="12" fill="#2a7a95" class="f7">Tailwind CSS</text>

<circle cx="616" cy="206" r="3" fill="#cc8820" class="bk2 f8"/>
<text x="628" y="210" font-size="12" fill="#cc8820" class="f8">AI / ML</text>
<text x="718" y="210" font-size="11" fill="#665520" class="f8">LEARNING</text>

<circle cx="616" cy="226" r="3" fill="#cc8820" class="bk2 f8"/>
